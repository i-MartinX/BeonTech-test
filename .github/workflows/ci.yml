name: Playwright vs Cypress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate the Linux screenshot baselines and commit them
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # Baselines are per-OS. If the Linux ones do not exist yet (first run), or an update was requested,
  # the test jobs create them instead of comparing, and commit-baselines saves them to the repo.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.mode.outputs.update }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ "${{ inputs.update_baselines }}" = "true" ] \
            || [ ! -d playwright/__screenshots__/linux ] \
            || [ ! -d cypress/snapshots/linux ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright (headless, all browsers)
        run: npx playwright test ${{ needs.prepare.outputs.update == 'true' && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-playwright
          path: |
            reports
            !reports/cypress-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-playwright
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-playwright
          path: playwright/__screenshots__/linux
          if-no-files-found: ignore

  cypress:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run Cypress (headless, Electron)
        uses: cypress-io/github-action@v6
        env:
          UPDATE_SNAPSHOTS: ${{ needs.prepare.outputs.update }}
        with:
          install-command: npm ci
          command: npx cypress run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-cypress
          path: reports
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-cypress
          path: cypress/snapshots/linux
          if-no-files-found: ignore

  report:
    needs: [playwright, cypress]
    if: always() && needs.playwright.result != 'skipped' && needs.cypress.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix report ci
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      # The Linux baselines from this run, so the report shows exactly what was compared
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baselines-playwright
          path: playwright/__screenshots__/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baselines-cypress
          path: cypress/snapshots/linux
      - name: Merge results
        run: npm run report:data
      - name: Cypress HTML report
        run: npm run report:cypress-html
      - name: Build the report site
        run: |
          npm run report:build
          npm run report:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: report
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  commit-baselines:
    needs: [prepare, playwright, cypress]
    if: >-
      needs.prepare.outputs.update == 'true' &&
      github.event_name != 'pull_request' &&
      needs.playwright.result != 'skipped' && needs.cypress.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: baselines-playwright
          path: playwright/__screenshots__/linux
      - uses: actions/download-artifact@v4
        with:
          name: baselines-cypress
          path: cypress/snapshots/linux
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright/__screenshots__/linux cypress/snapshots/linux
          if git diff --cached --quiet; then
            echo "Baselines unchanged"
          else
            git commit -m "Update Linux visual baselines [skip ci]"
            git push
          fi
